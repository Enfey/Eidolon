import lit.formats

# Configuration file for the 'lit' test runner

# The name of this test suite
config.name = "Eidolon"

# Execute RUN: via lit's internal python shell
config.test_format = lit.formats.ShTest(execute_external=False)

# List of file extensions to treat as test files
config.suffixes = [".mlir"]

# List of directories and files to exclude from the test suite. 'Inputs' shall contain auxiliary inputs for various tests
config.excludes = ["Inputs", "CMakeLists.txt"]

# Directory where temporary test outputs and artefacts will be written
config.test_exec_root = lit_config.params["tests_dir"]

# Prepend build directory to PATH s.t. RUN: lines execute over the most recent build
config.environment["PATH"] = (
    lit_config.params["build_dir"] + ":" + config.environment["PATH"]
)